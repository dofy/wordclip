name: WordClip
options:
  bundleIdPrefix: xyz.phpz
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  defaultConfig: Debug
  xcodeVersion: "27.0"
  groupSortPosition: top
  createIntermediateGroups: true

# 本地 Swift Package（WordClipKit）
packages:
  WordClipKit:
    path: WordClipKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "5GS5X3MD6G"    # Apple Development 签名（需在 Xcode Accounts 里重新生成证书）
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:

  # ── macOS App ──────────────────────────────────────────────
  WordClip-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordClip
        excludes:
          - "**/*.md"
    resources:
      - path: WordClip/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WordClipKit
      - package: KeyboardShortcuts
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.phpz.WordClip.macOS
        PRODUCT_NAME: WordClip
        INFOPLIST_FILE: WordClip/Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "9212B14D50ACB86986465B987F4DEBBAB8D6B4F7"
        # 上架后需要的 entitlements
        CODE_SIGN_ENTITLEMENTS: WordClip/Resources/WordClip-macOS.entitlements

  # ── iOS / iPadOS App ───────────────────────────────────────
  WordClip-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordClip
        excludes:
          - "**/*.md"
    resources:
      - path: WordClip/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WordClipKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.phpz.WordClip
        PRODUCT_NAME: WordClip
        INFOPLIST_FILE: WordClip/Resources/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO  # 不用 Mac Catalyst
        TARGETED_DEVICE_FAMILY: "1,2"              # iPhone + iPad

schemes:
  WordClip-macOS:
    build:
      targets:
        WordClip-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []     # App 层无 XCTest；Kit 测试由 swift test 跑
    archive:
      config: Release

  WordClip-iOS:
    build:
      targets:
        WordClip-iOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
