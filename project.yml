name: WordClip
options:
  bundleIdPrefix: xyz.phpz
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  defaultConfig: Debug
  xcodeVersion: "27.0"
  groupSortPosition: top
  createIntermediateGroups: true

# 本地 Swift Package（WordClipKit）
packages:
  WordClipKit:
    path: WordClipKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "5GS5X3MD6G"    # Apple Development 签名（需在 Xcode Accounts 里重新生成证书）
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # 让 Xcode「General」标签的 Display Name / App Category 正确显示。
    # 实际注入仍由 Info.plist 中的同名键完成（手写 plist 时 INFOPLIST_KEY_* 不注入）。
    INFOPLIST_KEY_CFBundleDisplayName: WordClip
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"

configs:
  Debug: debug
  Release: release

targets:

  # ── macOS App ──────────────────────────────────────────────
  WordClip-macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordClip
        excludes:
          - "**/*.md"
          - "Resources/Info-macOS.plist"
          - "Resources/Info-iOS.plist"
          - "Resources/*.entitlements"
          - "Resources/*.storekit"   # 由 scheme 引用，不打包/不编译
          - "Resources/wordpacks"    # 见下方 folder reference（避免被展平到 Resources 根）
      # 词包目录作为 folder reference 打包，保留 wordpacks/ 子目录，
      # 供 Bundle.main.urls(forResourcesWithExtension:subdirectory:"wordpacks") 读取。
      - path: WordClip/Resources/wordpacks
        type: folder
    resources:
      - path: WordClip/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WordClipKit
      - package: KeyboardShortcuts
      - sdk: ServiceManagement.framework
      - sdk: Vision.framework            # OCR 取词：文字识别
      - sdk: ScreenCaptureKit.framework  # OCR 取词：屏幕区域截图
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.phpz.WordClip.macOS
        PRODUCT_NAME: WordClip
        INFOPLIST_FILE: WordClip/Resources/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "9212B14D50ACB86986465B987F4DEBBAB8D6B4F7"
        # 上架后需要的 entitlements
        CODE_SIGN_ENTITLEMENTS: WordClip/Resources/WordClip-macOS.entitlements

  # ── iOS / iPadOS App ───────────────────────────────────────
  WordClip-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordClip
        excludes:
          - "**/*.md"
          - "Resources/Info-macOS.plist"
          - "Resources/Info-iOS.plist"
          - "Resources/*.entitlements"
          - "Resources/*.storekit"   # 由 scheme 引用，不打包/不编译
          - "Resources/wordpacks"    # 见下方 folder reference（避免被展平到 Resources 根）
      # 词包目录作为 folder reference 打包，保留 wordpacks/ 子目录，
      # 供 Bundle.main.urls(forResourcesWithExtension:subdirectory:"wordpacks") 读取。
      - path: WordClip/Resources/wordpacks
        type: folder
    resources:
      - path: WordClip/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: WordClipKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.phpz.WordClip
        PRODUCT_NAME: WordClip
        INFOPLIST_FILE: WordClip/Resources/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO  # 不用 Mac Catalyst
        TARGETED_DEVICE_FAMILY: "1,2"              # iPhone + iPad

schemes:
  WordClip-macOS:
    build:
      targets:
        WordClip-macOS: all
    run:
      config: Debug
      # 本地 StoreKit 配置：无付费账号也能跑通完整购买/恢复流程（仅 Debug 运行时生效）
      storeKitConfiguration: WordClip/Resources/WordClip.storekit
    test:
      config: Debug
      targets: []     # App 层无 XCTest；Kit 测试由 swift test 跑
    archive:
      config: Release

  WordClip-iOS:
    build:
      targets:
        WordClip-iOS: all
    run:
      config: Debug
      storeKitConfiguration: WordClip/Resources/WordClip.storekit
    test:
      config: Debug
    archive:
      config: Release
