<?xml version="1.0" encoding="UTF-8"?>
<!-- 状态栏模板图标：纯黑 + 透明底。系统按 template 自动适配明暗模式。
     W 放大并可溢出书签轮廓，保证菜单栏小尺寸下清晰可辨。 -->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <mask id="cut">
    <rect width="64" height="64" fill="white"/>
    <!-- W 放大、加粗，垂直略偏上，允许触达/溢出书签边缘 -->
    <text x="32" y="28" font-family="-apple-system, Helvetica Neue, sans-serif" font-size="34"
          font-weight="900" fill="black" text-anchor="middle" dominant-baseline="central">W</text>
  </mask>
  <path d="M16 5 H48 a4 4 0 0 1 4 4 V59 L32 47 L12 59 V9 a4 4 0 0 1 4 -4 Z"
        fill="#000000" mask="url(#cut)"/>
</svg>
