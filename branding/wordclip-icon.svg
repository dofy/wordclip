<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变：蓝→紫 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CE0"/>
    </linearGradient>
    <!-- 卡片渐变：微弱的白到浅灰 -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FB"/>
    </linearGradient>
    <!-- 卡片投影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A2B5C" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 背景圆角方（iOS 会自动套圆角遮罩，这里铺满即可） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 单词卡片（略微倾斜，体现“卡片/剪藏”） -->
  <g transform="rotate(-8 512 512)" filter="url(#shadow)">
    <rect x="236" y="336" width="552" height="352" rx="44" fill="url(#card)"/>
    <!-- 卡片上的“单词”占位线条 -->
    <rect x="300" y="430" width="300" height="40" rx="20" fill="#5B8DEF"/>
    <rect x="300" y="510" width="424" height="24" rx="12" fill="#C7D3F0"/>
    <rect x="300" y="556" width="360" height="24" rx="12" fill="#C7D3F0"/>
  </g>

  <!-- 剪刀（右上，金黄强调色，呼应“剪藏”）：两刃在中心交叉，两环在下 -->
  <g transform="translate(660 250) rotate(20)" stroke="#FFC24B" stroke-width="32"
     stroke-linecap="round" fill="none">
    <!-- 交叉的两片刀刃（从中心轴点向上张开） -->
    <line x1="0" y1="120" x2="-70" y2="-30"/>
    <line x1="0" y1="120" x2="70" y2="-30"/>
    <!-- 两个指环（在下方，分列轴点两侧） -->
    <circle cx="-34" cy="158" r="30"/>
    <circle cx="34" cy="158" r="30"/>
    <!-- 中心铆钉 -->
    <circle cx="0" cy="120" r="10" fill="#FFC24B" stroke="none"/>
  </g>
</svg>
