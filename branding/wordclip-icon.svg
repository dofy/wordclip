<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kept in sync with scripts/generate_app_icon.swift, which renders the actual
  AppIcon set. Shared look across the phpz.xyz apps: flat #FF674D tile inset
  6.1% from the canvas, 25% corner radius, one solid white glyph. No gradients
  and no drop shadows.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="62" y="62" width="900" height="900" rx="225" ry="225" fill="#FF674D"/>
  <!-- 书签：顶部平、底部 V 缺口，象征“收藏单词” -->
  <path d="M307 281 H717 a34 34 0 0 1 34 34 V627 L512 743 L273 627 V315 a34 34 0 0 1 34 -34 Z"
        fill="#FFFFFF"/>
  <!-- W 以背景色镂空，粗笔画圆端，与同族图标的字形重量一致 -->
  <path d="M446 379 L473 481 L512 424 L551 481 L578 379"
        fill="none" stroke="#FF674D" stroke-width="43"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
